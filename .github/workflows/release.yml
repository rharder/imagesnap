name: Release

# Builds a universal (arm64 + x86_64) binary and attaches it to a GitHub
# release whenever a version tag (e.g. 0.3.1) is pushed.
on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build universal binary
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build
        run: ./build.sh build

      - name: Verify universal binary
        run: |
          lipo -info build/Release/imagesnap
          lipo -info build/Release/imagesnap | grep -q arm64  || { echo "missing arm64 slice"; exit 1; }
          lipo -info build/Release/imagesnap | grep -q x86_64 || { echo "missing x86_64 slice"; exit 1; }

      - name: Smoke test
        run: build/Release/imagesnap -h

      - name: Create release with binary
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          ASSET="imagesnap-${TAG}"
          cp build/Release/imagesnap "${ASSET}"
          shasum -a 256 "${ASSET}"
          gh release create "${TAG}" "${ASSET}" --title "v${TAG}" --generate-notes
